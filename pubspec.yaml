name: obrafcontrol_test
description: "Registro diario de obras - Base Técnica Offline First"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Gestión de Estado
  flutter_riverpod: ^2.5.1

  # Base de Datos Local (Drift + SQLite)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Backend y Configuración
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0

  # Utilidades
  connectivity_plus: ^6.0.5
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - .env